name: Sync LeetCode Solutions

on:
  schedule:
    - cron: '0 * * * *'   # every hour, adjust as you like
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run LeetCode sync
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRFTOKEN: ${{ secrets.LEETCODE_CSRFTOKEN }}
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
        run: node scripts/sync.js

      - name: Commit and push changes
        env:
          GIT_AUTHOR_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
          GIT_COMMITTER_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
        run: |
          git add -A
          git diff --staged --quiet || git commit -m "Sync LeetCode submissions $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
